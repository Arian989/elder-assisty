name: Build ElderAssist APK

on:
  workflow_dispatch:
  push:
    branches: [ "main" ]
    paths-ignore:
      - ".github/workflows/build.yml"

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Assemble Android project and build APK
        run: |
          set -e
          mkdir -p app/src/main/java/com/example/elderassist
          mkdir -p app/src/main/res/xml
          mkdir -p app/src/main/assets

          cp AndroidManifest.xml app/src/main/AndroidManifest.xml
          cp MainActivity.java app/src/main/java/com/example/elderassist/MainActivity.java
          cp GalleryReader.java app/src/main/java/com/example/elderassist/GalleryReader.java
          cp GallerySyncBridge.java app/src/main/java/com/example/elderassist/GallerySyncBridge.java
          cp LockAdminReceiver.java app/src/main/java/com/example/elderassist/LockAdminReceiver.java
          cp PermissionBridge.java app/src/main/java/com/example/elderassist/PermissionBridge.java
          cp device_admin_receiver.xml app/src/main/res/xml/device_admin_receiver.xml
          cp index.html app/src/main/assets/index.html
          cp permissions.js app/src/main/assets/permissions.js

          sed -i '1s/package com.example.eldergallery;/package com.example.elderassist;/' app/src/main/java/com/example/elderassist/GalleryReader.java

          cat << 'EOF' > settings.gradle
          rootProject.name = "ElderAssist"
          include(":app")
          EOF

          cat << 'EOF' > build.gradle
          buildscript {
            repositories {
              google()
              mavenCentral()
            }
            dependencies {
              classpath "com.android.tools.build:gradle:8.2.2"
            }
          }
          allprojects {
            repositories {
              google()
              mavenCentral()
            }
          }
          EOF

          cat << 'EOF' > app/build.gradle
          plugins {
            id "com.android.application"
          }

          android {
            namespace "com.example.elderassist"
            compileSdk 34

            defaultConfig {
              applicationId "com.example.elderassist"
              minSdk 24
              targetSdk 34
              versionCode 1
              versionName "1.0"
            }

            buildTypes {
              release {
                minifyEnabled false
              }
              debug {
                minifyEnabled false
              }
            }

            compileOptions {
              sourceCompatibility JavaVersion.VERSION_17
              targetCompatibility JavaVersion.VERSION_17
            }
          }

          dependencies {
            implementation "androidx.appcompat:appcompat:1.6.1"
          }
          EOF

          gradle assembleDebug --no-daemon

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: ElderAssist-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          
